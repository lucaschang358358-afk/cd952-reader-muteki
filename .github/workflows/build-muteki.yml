name: Build CD-952 Muteki Reader

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-cd952:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flatpak & Muteki SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//24.08
          curl -L -o muteki.flatpak \
            https://github.com/Project-Muteki/org.freedesktop.Sdk.Extension.muteki/releases/download/2025082001/org.freedesktop.Sdk.Extension.muteki-x86_64-24.08-2025082001.flatpak
          flatpak install --user -y muteki.flatpak

      - name: Compile CD-952 .exe
        run: |
          flatpak run --user --filesystem=host --command=bash org.freedesktop.Sdk//24.08 -c '
            set -e
            if [ -f /usr/lib/sdk/muteki/enable.sh ]; then
              source /usr/lib/sdk/muteki/enable.sh
            fi
            export PATH="/usr/lib/sdk/muteki/bin:$PATH"

            echo "=== Muteki SDK files ==="
            ls -la /usr/lib/sdk/muteki/ || true

            # 1. 優先尋找 SDK 內建的 meson cross file
            CROSS_FILE=$(find /usr/lib/sdk/muteki -path "*meson*cross*" -type f | grep -i "arm9" | head -n 1 || true)
            if [ -z "$CROSS_FILE" ]; then
              CROSS_FILE=$(find /usr/lib/sdk/muteki -path "*meson*cross*" -type f | head -n 1 || true)
            fi

            # 2. 若找不到內建設定檔，自動產生一份標準 arm-none-bestaeabi cross file
            if [ -z "$CROSS_FILE" ]; then
              GCC_BIN=$(find /usr/lib/sdk/muteki -name "arm-none-bestaeabi-gcc" -type f | head -n 1 || true)
              if [ -z "$GCC_BIN" ]; then
                echo "ERROR: Cannot find arm-none-bestaeabi-gcc in /usr/lib/sdk/muteki"
                find /usr/lib/sdk/muteki -maxdepth 3
                exit 1
              fi
              BIN_DIR=$(dirname "$GCC_BIN")
              export PATH="$BIN_DIR:$PATH"
              CROSS_FILE="$PWD/arm9-cross.ini"
              cat > "$CROSS_FILE" <<EOF
          [binaries]
          c = '\''$BIN_DIR/arm-none-bestaeabi-gcc'\''
          cpp = '\''$BIN_DIR/arm-none-bestaeabi-g++'\''
          ar = '\''$BIN_DIR/arm-none-bestaeabi-ar'\''
          strip = '\''$BIN_DIR/arm-none-bestaeabi-strip'\''

          [host_machine]
          system = '\''besta'\''
          cpu_family = '\''arm'\''
          cpu = '\''arm926ej-s'\''
          endian = '\''little'\''
          EOF
            fi

            echo "Using cross file: $CROSS_FILE"
            meson setup build-muteki --cross-file "$CROSS_FILE"
            meson compile -C build-muteki
            ls -la build-muteki/
          '

      - name: Upload CD-952 .exe
        uses: actions/upload-artifact@v4
        with:
          name: cd952-reader-muteki-exe
          path: build-muteki/cd952-reader.exe
